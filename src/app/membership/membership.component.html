<div class="pt-32 pb-24 px-6 md:px-12 max-w-screen-2xl mx-auto">

    <!-- Title -->
    <div class="text-center md:text-left mb-20">
        <h1 class="text-6xl md:text-8xl font-black uppercase text-white">
            ELITE <span class="text-primary">ACCESS</span>
        </h1>
        <p class="mt-6 text-on-surface-variant">
            Choose your transformation plan.
        </p>
    </div>

    <!-- Pricing -->
    <div class="grid md:grid-cols-3 gap-8">

        <div *ngFor="let plan of plans" class="p-8 rounded-xl bg-surface-container-low" [class.ring-2]="plan.popular"
            [class.ring-primary]="plan.popular">

            <!-- Popular Tag -->
            <div *ngIf="plan.popular" class="absolute bg-primary text-black px-3 py-1 text-xs">
                Most Popular
            </div>

            <h2 class="text-2xl font-bold">{{ plan.name }}</h2>

            <div class="text-4xl font-black text-white mt-2">
                ${{ plan.price }}
            </div>

            <!-- Features -->
            <ul class="mt-6 space-y-3">
                <li *ngFor="let f of plan.features" class="text-on-surface-variant">
                    ✔ {{ f }}
                </li>
            </ul>

            <!-- Button -->
            <button class="mt-8 w-full py-3 bg-primary text-black font-bold rounded-full">
                Choose {{ plan.name }}
            </button>

        </div>

    </div>

</div>
